name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: 'PyPI repository'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/*
      
      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing - 无需 password，自动使用 OIDC token
  
  verify-installation:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'pypi')
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Wait for PyPI to sync
        run: |
          echo "⏳ Waiting 60 seconds for PyPI to sync the new package..."
          sleep 60
      
      - name: Install from PyPI
        run: |
          echo "📦 Installing sm-py-bc from PyPI..."
          pip install --index-url https://pypi.org/simple/ sm-py-bc --no-cache-dir
      
      - name: Verify installation
        run: |
          echo "🧪 Verifying installation..."
          python -c "import sm_bc; print(f'✓ Version: {sm_bc.__version__}')"
          python -c "import sm_bc; print(f'✓ Author: {sm_bc.__author__}')"
          python -c "import sm_bc; print(f'✓ License: {sm_bc.__license__}')"
          echo "✓ All imports successful!"
      
      - name: Checkout examples
        uses: actions/checkout@v4
        with:
          sparse-checkout: examples
          
      - name: Test SM3 example
        run: |
          echo "🧪 Testing SM3 hash example..."
          cat > test_sm3.py << 'EOF'
          from sm_bc.crypto.digests import SM3Digest
          
          # SM3 哈希测试
          digest = SM3Digest()
          data = 'Hello, SM3!'.encode('utf-8')
          digest.update_bytes(data, 0, len(data))
          
          hash_output = bytearray(digest.get_digest_size())
          digest.do_final(hash_output, 0)
          
          print('✓ SM3 Hash:', hash_output.hex())
          assert len(hash_output) == 32, "SM3 hash should be 32 bytes"
          print('✓ SM3 test passed')
          EOF
          
          python test_sm3.py
      
      - name: Test SM4 ECB example
        run: |
          echo "🧪 Testing SM4 ECB example..."
          cat > test_sm4.py << 'EOF'
          from sm_bc.crypto.engines import SM4Engine
          from sm_bc.crypto.modes import ECBBlockCipher
          from sm_bc.crypto.paddings import PKCS7Padding
          from sm_bc.crypto.cipher import PaddedBufferedBlockCipher
          from sm_bc.crypto.params import KeyParameter
          import secrets
          
          # SM4 ECB 加密测试
          key = secrets.token_bytes(16)
          plaintext = 'Hello, SM4!'.encode('utf-8')
          
          cipher = PaddedBufferedBlockCipher(
              ECBBlockCipher(SM4Engine()),
              PKCS7Padding()
          )
          cipher.init(True, KeyParameter(key))
          
          output = bytearray(cipher.get_output_size(len(plaintext)))
          length = cipher.process_bytes(plaintext, 0, len(plaintext), output, 0)
          length += cipher.do_final(output, length)
          ciphertext = bytes(output[:length])
          
          # 解密
          cipher.init(False, KeyParameter(key))
          decrypted = bytearray(cipher.get_output_size(len(ciphertext)))
          dec_len = cipher.process_bytes(ciphertext, 0, len(ciphertext), decrypted, 0)
          dec_len += cipher.do_final(decrypted, dec_len)
          
          assert bytes(decrypted[:dec_len]) == plaintext, "Decryption failed"
          print('✓ SM4 ECB encryption/decryption passed')
          EOF
          
          python test_sm4.py
      
      - name: Test module imports
        run: |
          echo "🧪 Testing module imports..."
          python -c "
          from sm_bc.crypto.signers import SM2Signer
          from sm_bc.crypto.cipher import create_sm4_cipher
          from sm_bc.crypto.digests import SM3Digest
          from sm_bc.math.ec_curve import SM2P256V1Curve
          print('✓ All core modules import successfully')
          "
      
      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        run: |
          echo "🔍 Verifying version matches tag..."
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(python -c "import sm_bc; print(sm_bc.__version__)")
          
          if [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "✓ Version matches! Tag: v$TAG_VERSION, Package: $PACKAGE_VERSION"
          else
            echo "✗ Version mismatch! Tag: v$TAG_VERSION, Package: $PACKAGE_VERSION"
            exit 1
          fi
