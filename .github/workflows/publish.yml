name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: 'PyPI repository'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: twine check dist/*
      
      - name: Publish to Test PyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'testpypi'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/*
      
      - name: Publish to PyPI (Trusted Publishing)
        if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'pypi')
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing - 无需 password，自动使用 OIDC token
  
  verify-installation:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'pypi')
    
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Wait for PyPI to sync
        run: |
          echo "⏳ Waiting 60 seconds for PyPI to sync the new package..."
          sleep 60
      
      - name: Install from PyPI
        run: |
          echo "📦 Installing sm-py-bc from PyPI..."
          pip install --index-url https://pypi.org/simple/ sm-py-bc --no-cache-dir
      
      - name: Verify installation
        run: |
          echo "🧪 Verifying installation..."
          python -c "import sm_bc; print(f'✓ Version: {sm_bc.__version__}')"
          python -c "import sm_bc; print(f'✓ Author: {sm_bc.__author__}')"
          python -c "import sm_bc; print(f'✓ License: {sm_bc.__license__}')"
          echo "✓ All imports successful!"
      
      - name: Test basic functionality
        run: |
          echo "🧪 Testing basic functionality..."
          python -c "
          from sm_bc.crypto.cipher import create_sm4_cipher
          from sm_bc.crypto.digests import SM3Digest
          import secrets
          
          # Test SM4
          key = secrets.token_bytes(16)
          iv = secrets.token_bytes(16)
          cipher = create_sm4_cipher(mode='CBC', padding='PKCS7')
          cipher.init(True, key, iv)
          ciphertext = cipher.encrypt(b'Hello, SM4!')
          print('✓ SM4 encryption works')
          
          # Test SM3
          digest = SM3Digest()
          digest.update(b'Hello, SM3!')
          hash_output = bytearray(32)
          digest.do_final(hash_output, 0)
          print('✓ SM3 hashing works')
          
          print('✓ Basic functionality verified!')
          "
      
      - name: Verify version matches tag
        if: github.ref_type == 'tag'
        run: |
          echo "🔍 Verifying version matches tag..."
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION=$(python -c "import sm_bc; print(sm_bc.__version__)")
          
          if [ "$TAG_VERSION" = "$PACKAGE_VERSION" ]; then
            echo "✓ Version matches! Tag: v$TAG_VERSION, Package: $PACKAGE_VERSION"
          else
            echo "✗ Version mismatch! Tag: v$TAG_VERSION, Package: $PACKAGE_VERSION"
            exit 1
          fi
